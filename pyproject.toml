[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "psyq-sym"
version = "0.1.0"
description = "Recover Psy-Q SYM fragments from ROMs as generic names and types"
requires-python = ">=3.11"
license = {file = "UNLICENSE"}
[project.scripts]
psyq-sym = "psyq_sym.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
